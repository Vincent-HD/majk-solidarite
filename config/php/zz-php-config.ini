[php]
memory_limit = 2048M
auto_prepend_file = '/var/www/html/wordfence-waf.php'
upload_max_filesize = 1024M
post_max_size = 2048M
max_execution_time = 300
max_input_time = 300
max_input_vars = 10000

; CVE-2026-115560: keep disabled until PHP ships and we deploy the upstream fix.
; https://www.php.net/archive/2026.php#2026-10-23-1
session.upload_progress.enabled = 0
